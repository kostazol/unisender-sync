# Portainer -> Docker Swarm -> Stacks -> Add stack -> Web editor.
# Replace the example image, CRM URL and application UUID.
version: "3.8"
services:
  sync:
    image: ghcr.io/kostazol/unisender-sync:1.1.0
    stop_grace_period: 45s
    environment:
      Settings__Megaplan__BaseUrl: https://megaplan.example.com
      Settings__Megaplan__ExpectedIntegrationUuid: 4954444c-5f4b-4c16-bf4f-99a0953cbcc4
      Settings__Megaplan__EligibilityGlobalTagName: Unisender
      Settings__Unisender__ListName: Мегаплан
      Settings__Sync__PollingIntervalMinutes: "5" # 0 отключает резервный опрос.
      Secrets__MegaplanApiToken: ${MEGAPLAN_API_TOKEN:?}
      Secrets__UnisenderApiKey: ${UNISENDER_API_KEY:?}
      Secrets__WebhookSecret: ${WEBHOOK_SECRET:?}
    ports:
      - "5080:8080"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
